<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="產品管理">
<title>產品管理</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
  font-size: 18px; line-height: 1.5;
  background: #f5f5f7; color: #1d1d1f;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 100vh;
}
header {
  position: sticky; top: 0;
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  padding: 16px 14px 14px;
  border-bottom: 2px solid #e5e5e7;
  z-index: 100;
}
h1 { margin: 0 0 14px; font-size: 24px; font-weight: 700; text-align: center; }
.search-box { position: relative; }
.search-box input {
  width: 100%; padding: 16px 144px 16px 48px; font-size: 19px;
  border: 2px solid #d2d2d7; border-radius: 14px;
  background: #fff; outline: none; -webkit-appearance: none;
}
.search-box input:focus { border-color: #0071e3; box-shadow: 0 0 0 4px rgba(0,113,227,.15); }
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; fill: #86868b;
}
.search-actions {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: flex; gap: 4px;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px;
  border: none; cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  background: #e8f0fe; color: #1a73e8;
}
.icon-btn:active { background: #d2e3fc; }
.stats { font-size: 15px; color: #6e6e73; text-align: center; margin-top: 10px; }

.search-history {
  position: absolute; top: 100%; left: 0; right: 0;
  margin-top: 6px;
  background: #fff;
  border: 2px solid #e5e5e7;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  z-index: 60;
  max-height: 320px; overflow-y: auto;
  display: none;
}
.search-history.show { display: block; }
.search-history-header {
  padding: 10px 16px;
  font-size: 13px; color: #86868b;
  display: flex; justify-content: space-between; align-items: center;
  background: #fafafa; font-weight: 600;
  border-bottom: 1px solid #f0f0f0;
}
.search-history-clear {
  background: none; border: none;
  color: #d93025; font-size: 13px; font-weight: 600;
  cursor: pointer; padding: 4px 8px;
}
.search-history-item {
  padding: 12px 16px;
  font-size: 16px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
  border-bottom: 1px solid #f5f5f7;
}
.search-history-item:last-child { border-bottom: none; }
.search-history-item:active { background: #f5f5f7; }
.search-history-del {
  background: none; border: none;
  color: #c7c7cc; font-size: 15px;
  cursor: pointer; padding: 4px 10px;
}

.toolbar {
  display: flex; justify-content: center; gap: 8px;
  margin-top: 10px;
}
.tool-btn {
  padding: 8px 14px;
  border-radius: 10px;
  border: 2px solid #d2d2d7;
  background: #fff;
  color: #1d1d1f;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.tool-btn.active {
  background: #e8f0fe;
  border-color: #0071e3;
  color: #1a73e8;
}
.tool-btn:active { transform: scale(0.97); }

.phash-banner {
  margin: 10px 12px 0; padding: 12px 14px;
  background: #fff3cd; border-radius: 12px;
  font-size: 14px; color: #856404;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.phash-banner button {
  padding: 8px 14px; border-radius: 8px; border: none;
  background: #0071e3; color: #fff; font-weight: 600;
  font-size: 14px; cursor: pointer;
}
.phash-progress {
  width: 100%; height: 8px; border-radius: 4px;
  background: #ffe9a8; overflow: hidden; margin-top: 6px;
}
.phash-progress-bar {
  height: 100%; background: #f57c00; width: 0%;
  transition: width 0.3s;
}

.list { padding: 12px; }
.card {
  background: #fff; border-radius: 16px;
  padding: 14px; margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.card.search-result { border-left: 4px solid #1a73e8; }
.card-main { display: flex; gap: 14px; align-items: flex-start; }
.card img.thumb {
  width: 100px; height: 100px; object-fit: contain;
  border-radius: 12px; background: #f5f5f7; flex-shrink: 0;
}
.info { flex: 1; min-width: 0; }
.name-zh { font-size: 19px; font-weight: 700; line-height: 1.35; margin-bottom: 6px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.name { font-size: 15px; color: #6e6e73; margin-bottom: 8px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.price { font-size: 20px; font-weight: 700; color: #ff3b30; }
.id { font-family: ui-monospace, monospace; font-size: 13px; color: #86868b; }
.sim-badge {
  padding: 3px 10px; border-radius: 6px; font-size: 13px;
  font-weight: 700; color: #fff;
}
.loc-section {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px dashed #e5e5e7;
}
.loc-title {
  font-size: 14px; font-weight: 700; color: #2e7d32;
  margin-bottom: 8px;
}
.loc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.loc-item {
  background: #e8f5e9; border-radius: 8px; padding: 6px 4px;
  text-align: center;
}
.loc-item.empty { background: #f5f5f7; opacity: 0.5; }
.loc-item-label {
  font-size: 10px; color: #6e6e73; font-weight: 600;
  display: block; margin-bottom: 2px;
}
.loc-item-value {
  font-size: 14px; color: #1b5e20; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: block;
}
.loc-item.empty .loc-item-value { color: #b0b0b0; }
.meta-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px; padding-top: 8px;
  border-top: 1px dashed #e5e5e7;
  font-size: 12px; color: #86868b;
  flex-wrap: wrap; gap: 6px;
}
.lock-tag {
  background: #fff3cd; color: #856404; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
}
.src-tag {
  background: #e3f2fd; color: #1565c0; padding: 2px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
}

.card-actions { display: flex; gap: 6px; margin-top: 12px; }
.card-actions button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: opacity .15s;
}
.card-actions button:active { opacity: 0.7; }
.card-actions .btn-edit {
  flex: 2;
  background: #e8f0fe; color: #1a73e8;
}
.card-actions .btn-icon {
  flex: 0 0 48px;
  background: #f5f5f7; color: #1d1d1f;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.card-actions .btn-icon.btn-oos {
  background: #fff3cd; color: #856404;
}
.card-actions .btn-del {
  flex: 0 0 48px;
  background: #fce8e6; color: #d93025;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}

.add-btn {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px;
  width: 72px; height: 72px; border-radius: 36px;
  background: #0071e3; color: #fff; font-size: 38px; line-height: 1;
  border: none; box-shadow: 0 6px 16px rgba(0,113,227,.45);
  cursor: pointer; z-index: 200;
}
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 1000; align-items: flex-end;
}
.modal.show { display: flex; }
.modal-content {
  background: #fff; width: 100%; max-height: 94vh; overflow-y: auto;
  border-radius: 24px 24px 0 0;
  padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
}
.modal-content h2 { margin: 0 0 20px; font-size: 22px; font-weight: 700; }
.section-title {
  font-size: 15px; font-weight: 700; color: #0071e3;
  margin: 20px 0 12px; padding-bottom: 6px;
  border-bottom: 2px solid #e8f0fe;
}
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 16px; font-weight: 600;
  color: #1d1d1f; margin-bottom: 8px;
}
.field input, .field textarea {
  width: 100%; padding: 14px; font-size: 19px;
  border: 2px solid #d2d2d7; border-radius: 12px;
  font-family: inherit; -webkit-appearance: none; background: #fff;
}
.field input:focus, .field textarea:focus {
  border-color: #0071e3; outline: none;
  box-shadow: 0 0 0 3px rgba(0,113,227,.15);
}
.field textarea { min-height: 90px; resize: vertical; }
.field input:disabled { background: #f5f5f7; color: #86868b; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.field-select {
  width: 100%;
  padding: 14px 40px 14px 14px;
  font-size: 19px;
  border: 2px solid #d2d2d7;
  border-radius: 12px;
  font-family: inherit;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-color: #fff;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3e%3cpath fill='%2386868b' d='M6 9L1 4h10z'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 12px;
  color: #1d1d1f;
  min-height: 52px;
  line-height: 1.4;
  display: block;
}
.field-select:focus {
  border-color: #0071e3;
  outline: none;
  box-shadow: 0 0 0 3px rgba(0,113,227,.15);
}

.checkbox-group {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0;
}
.checkbox-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 14px; background: #f5f5f7;
  border: 2px solid #e5e5e7; border-radius: 10px;
  font-size: 16px; cursor: pointer; user-select: none;
  transition: all .15s;
}
.checkbox-item:active { transform: scale(0.97); }
.checkbox-item.checked {
  background: #e8f0fe; border-color: #0071e3;
  color: #1a73e8; font-weight: 600;
}
.checkbox-item input { display: none; }
.checkbox-item .check-mark {
  width: 18px; height: 18px;
  border: 2px solid #d2d2d7; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  background: #fff; font-size: 12px; color: transparent;
}
.checkbox-item.checked .check-mark {
  background: #0071e3; border-color: #0071e3; color: #fff;
}

.upload-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 20px; border-radius: 12px;
  background: #e8f0fe; color: #1a73e8;
  border: none; cursor: pointer;
  font-size: 17px; font-weight: 600; white-space: nowrap;
}
.img-preview {
  max-width: 160px; max-height: 160px;
  border-radius: 12px; margin-top: 10px;
  background: #f5f5f7; display: block;
}
.modal-actions {
  display: flex; gap: 12px; margin-top: 22px;
  padding-top: 20px; border-top: 2px solid #e5e5e7;
}
.modal-actions button {
  flex: 1; padding: 18px; font-size: 18px;
  border-radius: 14px; border: none; cursor: pointer; font-weight: 700;
}
.btn-cancel { background: #e5e5e7; color: #1d1d1f; }
.btn-save { background: #0071e3; color: #fff; }
.btn-save:disabled { background: #b0c4de; cursor: not-allowed; }
.btn-unlock {
  display: none; width: 100%; margin-top: 10px; padding: 14px;
  border-radius: 12px; border: none;
  background: #fff3cd; color: #856404;
  font-size: 16px; font-weight: 700; cursor: pointer;
}
.loading { text-align: center; padding: 80px 20px; color: #86868b; font-size: 18px; }
.toast {
  position: fixed; top: calc(24px + env(safe-area-inset-top)); left: 50%;
  transform: translateX(-50%);
  background: #1d1d1f; color: #fff;
  padding: 16px 24px; border-radius: 14px;
  font-size: 17px; font-weight: 500;
  z-index: 2000; opacity: 0; transition: opacity .3s;
  pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
.login-box { padding: 60px 24px; max-width: 420px; margin: 0 auto; }
.login-box h1 { margin-bottom: 28px; font-size: 26px; text-align: center; }
.login-box input[type="password"] {
  width: 100%; padding: 16px; font-size: 19px;
  border: 2px solid #d2d2d7; border-radius: 14px;
  margin-bottom: 16px; -webkit-appearance: none;
}
.login-box button {
  width: 100%; padding: 18px;
  background: #0071e3; color: #fff;
  border: none; border-radius: 14px;
  font-size: 19px; font-weight: 700; cursor: pointer;
}
.remember-row {
  display: flex; align-items: center; gap: 10px;
  margin: -4px 0 18px;
  font-size: 16px; color: #1d1d1f;
  cursor: pointer; user-select: none;
}
.remember-row input[type="checkbox"] {
  width: 22px; height: 22px;
  accent-color: #0071e3;
  cursor: pointer;
  margin: 0;
}
#scanModal .modal-content {
  border-radius: 24px; margin: 16px; max-height: 95vh;
  padding: 24px; align-self: center;
}
#reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; }
.scan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.scan-header h2 { margin: 0; font-size: 22px; }
.scan-close { background: none; border: none; font-size: 26px; color: #86868b; cursor: pointer; padding: 4px 10px; }
.scan-hint { text-align: center; color: #6e6e73; font-size: 16px; margin: 14px 0 0; }
.scan-torch {
  display: none; margin-top: 14px; width: 100%; padding: 14px;
  border-radius: 14px; background: #e5e5e7; border: none;
  font-size: 17px; font-weight: 600; cursor: pointer;
}
#debugBtn {
  position: fixed; bottom: 100px; left: 10px; z-index: 9999;
  padding: 8px 12px; background: #f00; color: #fff;
  border: none; border-radius: 8px; font-size: 12px;
  opacity: 0.5;
}

.options-section {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px dashed #e5e5e7;
}
.options-section-title {
  font-size: 16px;
  font-weight: 700;
  color: #0071e3;
  margin-bottom: 10px;
  padding: 8px 12px;
  background: #e8f0fe;
  border-radius: 8px;
}
.options-row {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.options-row .opt-value,
.options-row .opt-label {
  flex: 1;
  padding: 10px 12px;
  font-size: 16px;
  border: 2px solid #d2d2d7;
  border-radius: 8px;
  font-family: inherit;
  -webkit-appearance: none;
  background: #fff;
  min-width: 0;
}
.options-row .opt-value:focus,
.options-row .opt-label:focus {
  border-color: #0071e3;
  outline: none;
}
.options-del-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: none;
  background: #fce8e6;
  color: #d93025;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.options-add-btn {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: 2px dashed #0071e3;
  background: #fff;
  color: #0071e3;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.options-add-btn:active {
  background: #e8f0fe;
}
</style>
</head>
<body>

<div id="loginScreen" class="login-box" style="display:none">
  <h1>🔐 請輸入密碼</h1>
  <input type="password" id="pwdInput" placeholder="輸入密碼" autocomplete="current-password">
  <label class="remember-row">
    <input type="checkbox" id="rememberMe" checked>
    <span>記住我（下次自動登入）</span>
  </label>
  <button onclick="login()">登入</button>
</div>

<div id="appScreen" style="display:none">
  <header>
    <h1 style="display:flex;justify-content:center;align-items:center;gap:8px;">
      <span>📦 產品管理</span>
      <button id="btnOptionsMgr" onclick="openOptionsModal()" title="選項管理"
        style="display:none;background:none;border:none;font-size:22px;cursor:pointer;vertical-align:middle;">⚙️</button>
      <button id="btnLogout" onclick="logout()" title="登出"
        style="background:none;border:none;font-size:22px;cursor:pointer;vertical-align:middle;">🚪</button>
    </h1>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="搜尋 / 條碼 / 位置..." autocomplete="off">
      <div class="search-actions">
        <button class="icon-btn" id="btnScanSearch" title="掃碼搜尋">🔍</button>
        <button class="icon-btn" id="btnSearchByImage" title="以圖搜圖">📷</button>
        <button class="icon-btn" id="btnClear" title="清除" style="display:none;">✕</button>
      </div>
      <div class="search-history" id="searchHistory"></div>
    </div>
    <div class="stats" id="stats">載入中...</div>
    <div class="toolbar">
      <button id="btnSortToggle" class="tool-btn" onclick="toggleSort()">📍 位置排序</button>
    </div>
  </header>

  <div id="phashBanner" class="phash-banner" style="display:none;">
    <span id="phashBannerText"></span>
    <button onclick="buildPhashLibrary()">開始建立</button>
    <div class="phash-progress" id="phashProgress" style="display:none;">
      <div class="phash-progress-bar" id="phashProgressBar"></div>
    </div>
  </div>

  <div class="list" id="list"></div>
  <button class="add-btn" onclick="openAdd()">+</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">新增產品</h2>

    <div class="section-title">📋 產品資料</div>

    <div class="field">
      <label>ID *</label>
      <input id="f_id" autocomplete="off" inputmode="numeric">
    </div>

    <div class="field">
      <label>條碼 (Barcode) — 可多個，用 ; 分隔</label>
      <div style="display:flex; gap:10px;">
        <input id="f_barcode" autocomplete="off" inputmode="numeric" style="flex:1;" placeholder="123456;789012">
        <button type="button" class="upload-btn" onclick="startEditScan()">📷 掃描</button>
      </div>
    </div>

    <div class="field"><label>英文名稱</label><input id="f_name" autocomplete="off"></div>
    <div class="field"><label>中文名稱</label><input id="f_name_zh" autocomplete="off"></div>

    <div class="row-2">
      <div class="field"><label>價格</label><input id="f_price" autocomplete="off" inputmode="decimal"></div>
      <div class="field"><label>原價</label><input id="f_original_price" autocomplete="off" inputmode="decimal"></div>
    </div>

    <div class="field">
      <label>產品圖片</label>
      <input type="file" id="f_imageFile" accept="image/*" style="display:none">
      <button type="button" class="upload-btn" onclick="document.getElementById('f_imageFile').click()">
        📷 拍照 / 選擇圖片
      </button>
      <img id="f_imagePreview" class="img-preview" style="display:none">
      <input id="f_image" type="hidden">
    </div>

    <div class="row-2">
      <div class="field">
        <label>分類（英）</label>
        <select id="f_category_en" class="field-select">
          <option value="">— 請選擇 —</option>
        </select>
      </div>
      <div class="field"><label>分類（中）</label><input id="f_category_zh" autocomplete="off"></div>
    </div>
    <div class="field"><label>描述</label><textarea id="f_description"></textarea></div>

    <div class="section-title">📦 倉庫位置 (L ~ S)</div>

    <div class="row-2">
      <div class="field">
        <label>暫存位置 (L)</label>
        <input id="f_temp_location" autocomplete="off">
      </div>
      <div class="field">
        <label>併板 (M) — 可多選</label>
        <div id="f_combine_group" class="checkbox-group">
          <div style="color:#86868b;font-size:14px;">載入中...</div>

function toast(msg, ms) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function() { t.classList.remove('show'); }, ms || 2200);
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escAttr(s) { return String(s || '').replace(/'/g, "\\'"); }

function safeGetLS(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSetLS(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

function timeAgo(dateStr) {
  if (!dateStr) return '未曾修改';
  var dt = new Date(dateStr);
  if (isNaN(dt)) return String(dateStr);
  var diff = Date.now() - dt.getTime();
  if (diff < 0) return '剛剛';
  var sec = Math.floor(diff / 1000);
  if (sec < 60) return '剛剛';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + ' 分鐘前';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' 小時前';
  var day = Math.floor(hr / 24);
  if (day < 30) return day + ' 天前';
  var mo = Math.floor(day / 30);
  if (mo < 12) return mo + ' 個月前';
  return Math.floor(mo / 12) + ' 年前';
}

    localStorage.removeItem('token');

    sessionStorage.removeItem('isAdmin');

  var store = remember ? localStorage : sessionStorage;
  try {
    store.setItem('token', pwd);

  } catch (e) {}

}

async function apiGet(action, params) {
  var url = API_URL + '?action=' + encodeURIComponent(action) + '&token=' + encodeURIComponent(TOKEN);
  if (params) {
    Object.keys(params).forEach(function(k) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    });
  }
  var res = await fetch(url);
  return res.json();
}

async function apiPost(body) {
  var payload = Object.assign({}, body, {token: TOKEN});
  var res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  return res.json();
}


// ============================================================
// 搜尋歷史
// ============================================================
function getSearchHistory() {
  try {
    var raw = localStorage.getItem(SEARCH_HISTORY_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function addSearchHistory(term) {
  term = String(term || '').trim();
  if (!term || term.length < 1) return;
  var arr = getSearchHistory();
  var idx = arr.indexOf(term);
  if (idx >= 0) arr.splice(idx, 1);
  arr.unshift(term);
  if (arr.length > SEARCH_HISTORY_MAX) arr = arr.slice(0, SEARCH_HISTORY_MAX);
  try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(arr)); } catch (e) {}
}

function clearSearchHistory() {
  try { localStorage.removeItem(SEARCH_HISTORY_KEY); } catch (e) {}
  hideSearchHistory();
}

function showSearchHistory() {
  var arr = getSearchHistory();
  var el = $('searchHistory');
  if (!arr.length) { hideSearchHistory(); return; }
  var html = '<div class="search-history-header">'
    + '<span>🕐 最近搜尋</span>'
    + '<button class="search-history-clear" onclick="clearSearchHistory();event.stopPropagation();">清除全部</button>'
    + '</div>';
  html += arr.map(function(t) {
    var safeT = escAttr(t);
    return '<div class="search-history-item" onclick="pickSearchHistory(\'' + safeT + '\');event.stopPropagation();">'
      + '<span>' + esc(t) + '</span>'
      + '<button class="search-history-del" onclick="removeSearchHistory(\'' + safeT + '\');event.stopPropagation();">✕</button>'
      + '</div>';
  }).join('');
  el.innerHTML = html;
  el.classList.add('show');
}

function hideSearchHistory() {
  var el = $('searchHistory');
  if (el) el.classList.remove('show');
}

function pickSearchHistory(term) {
  $('q').value = term;
  hideSearchHistory();
  searchMode = 'text';
  render();
}

function removeSearchHistory(term) {
  var arr = getSearchHistory();
  var idx = arr.indexOf(term);
  if (idx >= 0) arr.splice(idx, 1);
  try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(arr)); } catch (e) {}
  showSearchHistory();
}

async function copyId(id) {
  var text = String(id);
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast('📋 已複製 ID：' + text);
    bumpUsage(id);
  } catch (e) {
    toast('❌ 複製失敗：' + e.message, 3000);
  }
}

// ============================================================
// ★ 產品比對（含數字尾碼搜尋）
// ============================================================
function productMatchesTerm(d, term) {
  // 建立可搜尋字串（多 barcode 用空白分隔）
  var barcodeStr = String(d.barcode || '').replace(/[;,，、]/g, ' ');
  var searchable = [
    d.id, barcodeStr, d.name, d.name_zh,
    d.category_en, d.category_zh, d.description,
    d.temp_location, d.combine, d.warehouse, d.island,
    d.aisle, d.crosslane, d.shelfnumber, d.floor
  ].map(function(v) { return v == null ? '' : String(v); })
   .join(' ')
   .toLowerCase();

  // 一般子字串匹配
  if (searchable.indexOf(term) >= 0) return true;

  // ★ 純數字：額外檢查數字欄位「結尾」
  if (/^\d+$/.test(term) && term.length >= 3) {
    var digitFields = [d.id, d.barcode, d.shelfnumber];
    for (var i = 0; i < digitFields.length; i++) {
      var raw = String(digitFields[i] || '');
      // 多 barcode 拆開，逐段比對尾碼
      var parts = raw.split(/[;,，、\s]+/);
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j];
        if (p && p.length >= term.length && p.slice(-term.length) === term) return true;
      }
    }
  }

  return false;
}

function populateSelects() {

function fillSelect(id, list) {
  var sel = $(id);
  if (!sel) return;
  var currentValue = sel.value;
  sel.innerHTML = '<option value="">— 請選擇 —</option>';
  if (!list || !list.length) return;
  list.forEach(function(opt) {
    var option = document.createElement('option');
    option.value = opt.value;
    option.textContent = opt.label || opt.value;
    sel.appendChild(option);
  });
  if (currentValue) sel.value = currentValue;
}

function renderCombineCheckboxes() {
  var container = $('f_combine_group');
  if (!container) return;
  if (!OPTIONS.combine || !OPTIONS.combine.length) {
    container.innerHTML = '<div style="color:#86868b;font-size:14px;">無選項</div>';
    return;
  }
  var currentValue = $('f_combine').value || '';
  var selected = currentValue.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
  container.innerHTML = OPTIONS.combine.map(function(opt) {
    var checked = selected.indexOf(opt.value) >= 0;
    return '<label class="checkbox-item' + (checked ? ' checked' : '') + '" data-value="' + escAttr(opt.value) + '">' +
      '<span class="check-mark">✓</span>' +
      '<input type="checkbox" value="' + escAttr(opt.value) + '"' + (checked ? ' checked' : '') + '>' +
      '<span>' + esc(opt.label) + '</span>' +
    '</label>';
  }).join('');

  container.querySelectorAll('.checkbox-item').forEach(function(item) {
    item.onclick = function(e) {
      e.preventDefault();
      var cb = item.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      item.classList.toggle('checked', cb.checked);
      updateCombineValue();
    };
  });
}

function updateCombineValue() {
  var container = $('f_combine_group');
  if (!container) return;
  var checked = [];
  container.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb) {
    checked.push(cb.value);
  });
  $('f_combine').value = checked.join(',');
}

function setCombineValue(value) {
  $('f_combine').value = value || '';
  if ($('f_combine_group').querySelector('.checkbox-item')) {
    renderCombineCheckboxes();
  }
}

function renderOptionRow(type, index, opt) {
  return [
    '<div class="options-row">',
    '  <input class="opt-value" placeholder="儲存值" value="' + escAttr(opt.value) + '"',
    '         onchange="updateOption(\'' + type + '\', ' + index + ', \'value\', this.value)">',
    '  <input class="opt-label" placeholder="顯示名稱" value="' + escAttr(opt.label) + '"',
    '         onchange="updateOption(\'' + type + '\', ' + index + ', \'label\', this.value)">',
    '  <button type="button" class="options-del-btn" onclick="removeOption(\'' + type + '\', ' + index + ')">✕</button>',
    '</div>'
  ].join('');
}

function updateOption(type, index, field, value) {
  if (!editingOptions[type] || !editingOptions[type][index]) return;
  editingOptions[type][index][field] = value.trim();
}

function addOption(type) {
  if (!editingOptions[type]) editingOptions[type] = [];
  editingOptions[type].push({value: '', label: ''});
  renderOptionsEditor();
  setTimeout(function() {
    var section = $('options-' + type);
    if (section && section.lastElementChild) {
      var inp = section.lastElementChild.querySelector('.opt-value');
      if (inp) inp.focus();
    }
  }, 100);
}

function removeOption(type, index) {
  if (!editingOptions[type]) return;
  if (!confirm('確定刪除此選項？\n\n已使用此值的產品不會受影響。')) return;
  editingOptions[type].splice(index, 1);
  renderOptionsEditor();
}

function closeOptionsModal() {
  if (editingOptions && JSON.stringify(editingOptions) !== JSON.stringify(OPTIONS)) {
    if (!confirm('有未儲存的變更，確定要關閉嗎？')) return;
  }
  editingOptions = null;
  $('optionsModal').classList.remove('show');
}

async function saveOptionsToServer() {
  if (!editingOptions) return;

  var types = Object.keys(editingOptions);
  for (var i = 0; i < types.length; i++) {
    var list = editingOptions[types[i]];
    for (var j = 0; j < list.length; j++) {
      if (!list[j].value) {
        toast('❌ 有選項的「儲存值」是空的，請填寫或刪除該行');
        return;
      }
      if (!list[j].label) list[j].label = list[j].value;
    }
  }

  if (!confirm('確定儲存？這會覆寫 _Config 工作表。')) return;

  try {
    toast('📤 儲存中...');
    var result = await apiPost({
      action: 'saveOptions',
      options: editingOptions
    });

    if (result.error) {
      toast('❌ ' + result.error, 3000);
      return;
    }

    OPTIONS = JSON.parse(JSON.stringify(editingOptions));
    optionsLoaded = true;
    populateSelects();
    renderCombineCheckboxes();
    editingOptions = null;
    $('optionsModal').classList.remove('show');
    toast('✅ 選項已儲存，共 ' + result.count + ' 個', 2500);
  } catch (e) {
    toast('❌ ' + e.message, 3000);
  }
}

async function fetchFromCDN() {
  var bucket = Math.floor(Date.now() / 300000);
  var url = CDN_URL + '?t=' + bucket;
  var res = await fetch(url, { cache: 'default' });
  if (!res.ok) throw new Error('CDN HTTP ' + res.status);
  var data = await res.json();
  if (!data.items || !Array.isArray(data.items)) throw new Error('資料格式錯誤');
  _lastVersion = data.version || 0;
  console.log('📦 CDN：' + data.count + ' 項，更新於 ' + data.updated);
  return data.items;
}

async function loadData(forceRefresh) {
  if (!forceRefresh) {
    try {
      var cachedStr = safeGetLS(LOCAL_CACHE_KEY);
      var cachedTime = parseInt(safeGetLS(LOCAL_CACHE_TIME_KEY) || '0');
      if (cachedStr && (Date.now() - cachedTime < LOCAL_CACHE_TTL)) {
        var cached = JSON.parse(cachedStr);
        if (Array.isArray(cached) && cached.length > 0) {
          applyProducts(cached);
          render();
          $('stats').textContent += ' · 本地快取';
          backgroundRefresh();
          checkPhashStatus();
          return;
        }
      }
    } catch (e) {
      console.warn('本地快取讀取失敗：', e);
    }
  }

  $('stats').textContent = '載入中...';
  try {
    var products = await fetchFromCDN();
    applyProducts(products);
    saveLocalCache(products);
    render();
    checkPhashStatus();
  } catch (e) {
    console.error('CDN 失敗，改用 API：', e);
    try {
      var data = await apiGet('list');
      if (data.error) throw new Error(data.error);
      applyProducts(data);
      saveLocalCache(data);
      render();
      checkPhashStatus();
    } catch (e2) {
      $('stats').textContent = '載入失敗：' + e2.message;
    }
  }
}

async function backgroundRefresh() {
  if (_bgRefreshing) return;
  _bgRefreshing = true;
  try {
    var products = await fetchFromCDN();
    applyProducts(products);
    saveLocalCache(products);
    render();
  } catch (e) {
    console.warn('背景更新失敗：', e);
  } finally {
    _bgRefreshing = false;
  }
}

function applyProducts(data) {
  var previewMap = {};
  allData.forEach(function(d) { if (d._preview) previewMap[d.id] = d._preview; });
  allData = data.map(function(d) {
    if (previewMap[d.id]) d._preview = previewMap[d.id];
    return d;
  });
  searchMode = 'text';
}

function saveLocalCache(data) {
  try {
    safeSetLS(LOCAL_CACHE_KEY, JSON.stringify(data));
    safeSetLS(LOCAL_CACHE_TIME_KEY, String(Date.now()));
  } catch (e) {
    try {
      var lite = data.map(function(p) {
        return {
          id: p.id, barcode: p.barcode, name: p.name, name_zh: p.name_zh,
          price: p.price, image: p.image,
          temp_location: p.temp_location, combine: p.combine,
          warehouse: p.warehouse, island: p.island, aisle: p.aisle,
          crosslane: p.crosslane, shelfnumber: p.shelfnumber, floor: p.floor,
          _last_modified: p._last_modified, _last_source: p._last_source
        };
      });
      safeSetLS(LOCAL_CACHE_KEY, JSON.stringify(lite));
      safeSetLS(LOCAL_CACHE_TIME_KEY, String(Date.now()));
    } catch (e2) {}
  }
}

function clearLocalCache() {
  try {
    localStorage.removeItem(LOCAL_CACHE_KEY);
    localStorage.removeItem(LOCAL_CACHE_TIME_KEY);
  } catch (e) {}
}

function render() {
  var raw = $('q').value.trim().toLowerCase()
    .replace(/\u3000/g, ' ')
    .replace(/[\uFF01-\uFF5E]/g, function(c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
  var terms = raw.split(/\s+/).filter(function(t) { return t; });

  var filtered = terms.length === 0
    ? allData.slice()
    : allData.filter(function(d) {
        return terms.every(function(t) { return productMatchesTerm(d, t); });
      });

  if (sortMode === 'location') {
    filtered.sort(function(a, b) {
      var ka = locationSortKey(a);
      var kb = locationSortKey(b);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  }

  var statsText = terms.length
    ? '找到 ' + filtered.length + ' / ' + allData.length + ' 項'
    : '共 ' + allData.length + ' 項';
  if (sortMode === 'location') statsText += ' · 按位置';
  $('stats').textContent = statsText;

  $('btnClear').style.display = raw ? 'flex' : 'none';

  if (filtered.length === 0) {
    $('list').innerHTML = '<div class="loading">沒有資料</div>';
    return;
  }

  var MAX = 100;
  var html = filtered.slice(0, MAX).map(function(d) { return renderCard(d); }).join('');
  if (filtered.length > MAX) {
    html += '<div class="loading">還有 ' + (filtered.length - MAX) + ' 項，請縮小搜尋範圍</div>';
  }
  $('list').innerHTML = html;
}

// ============================================================
// pHash
// ============================================================
function computePhashFromImage(img) {
  var canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 32;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, 32, 32);
  var imageData = ctx.getImageData(0, 0, 32, 32);
  var data = imageData.data;
  var gray = new Float32Array(1024);
  for (var i = 0; i < 1024; i++) {
    gray[i] = 0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2];
  }
  var N = 32;
  var cos = [];
  for (var u = 0; u < 8; u++) {
    cos[u] = new Float32Array(N);
    for (var x = 0; x < N; x++) {
      cos[u][x] = Math.cos(((2 * x + 1) * u * Math.PI) / (2 * N));
    }
  }
  var dct = new Float32Array(64);
  var idx = 0;
  for (var u2 = 0; u2 < 8; u2++) {
    for (var v = 0; v < 8; v++) {
      var sum = 0;
      for (var y = 0; y < N; y++) {
        for (var x2 = 0; x2 < N; x2++) {
          sum += gray[y*N + x2] * cos[u2][x2] * cos[v][y];
        }
      }
      var cu = u2 === 0 ? 1/Math.sqrt(2) : 1;
      var cv = v === 0 ? 1/Math.sqrt(2) : 1;
      dct[idx++] = 0.25 * cu * cv * sum;
    }
  }
  var ac = [];
  for (var k = 1; k < 64; k++) ac.push(dct[k]);
  var sorted = ac.slice().sort(function(a,b) { return a-b; });
  var median = sorted[Math.floor(sorted.length / 2)];
  var binary = '';
  for (var m = 0; m < 64; m++) binary += ac[m] > median ? '1' : '0';
  var hex = '';
  for (var n = 0; n < 64; n += 4) {
    hex += parseInt(binary.substr(n, 4), 2).toString(16);
  }
  return hex;
}

function computePhashFromUrl(url) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      try { resolve(computePhashFromImage(img)); }
      catch (e) { reject(new Error('CORS')); }
    };
    img.onerror = function() { reject(new Error('圖片載入失敗')); };
    img.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
  });
}

function computePhashFromBlob(blob) {
  return new Promise(function(resolve, reject) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function() {
      URL.revokeObjectURL(url);
      try { resolve(computePhashFromImage(img)); }
      catch (e) { reject(e); }
    };
    img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('圖片載入失敗')); };
    img.src = url;
  });
}

// pHash 庫
// ============================================================
async function checkPhashStatus() {
  if (!isAdmin) { $('phashBanner').style.display = 'none'; return; }
  try {
    var status = await apiGet('phashStatus');
    if (status.error) return;
    var missing = status.missing || [];
    if (missing.length === 0) { $('phashBanner').style.display = 'none'; return; }
    $('phashBanner').style.display = 'flex';
    $('phashBannerText').textContent = '📸 有 ' + missing.length + ' 張圖片尚未建立指紋';
  } catch (e) {}
}

async function buildPhashLibrary() {
  var lock = await apiGet('phashLock');
  if (lock.error) { toast('❌ ' + lock.error); return; }
  if (!lock.ok) { toast('⏳ 已有人正在建立，請等 ' + lock.remainSec + ' 秒後再試', 4000); return; }

  try {
    var status = await apiGet('phashStatus');
    if (status.error) { toast('❌ ' + status.error); return; }
    var missing = status.missing || [];
    if (missing.length === 0) { toast('✅ 所有圖片已有指紋'); $('phashBanner').style.display = 'none'; return; }

    if (!confirm('將為 ' + missing.length + ' 張圖片建立指紋，可能需要 10-30 分鐘。\n\n過程中請保持頁面開啟。確定開始？')) return;

    $('phashProgress').style.display = 'block';
    var bar = $('phashProgressBar');
    bar.style.width = '0%';

    var idMap = {};
    allData.forEach(function(d) { idMap[String(d.id)] = d; });

    var batch = [];
    var done = 0, failed = 0;
    var total = missing.length;

    for (var i = 0; i < missing.length; i++) {
      var id = missing[i];
      var p = idMap[String(id)];
      if (!p || !p.image) { failed++; continue; }
      try {
        var phash = await computePhashFromUrl(p.image);
        batch.push({ id: p.id, phash: phash });
        done++;
      } catch (e) { failed++; }

      if (batch.length >= 20) {
        try { await apiPost({ action: 'savePhashBatch', items: batch.splice(0) }); } catch (e) {}
      }
      var pct = ((done + failed) / total * 100).toFixed(1);
      bar.style.width = pct + '%';
      $('phashBannerText').textContent = '建立中... ' + (done + failed) + '/' + total + '（成功 ' + done + '，失敗 ' + failed + '）';
    }

    if (batch.length > 0) {
      try { await apiPost({ action: 'savePhashBatch', items: batch }); } catch (e) {}
    }
    bar.style.width = '100%';
    toast('✅ 完成！成功 ' + done + '，失敗 ' + failed, 5000);
    $('phashBannerText').textContent = '✅ 完成！成功 ' + done + '，失敗 ' + failed;
    setTimeout(function() {
      $('phashBanner').style.display = 'none';
      $('phashProgress').style.display = 'none';
    }, 3000);
  } finally {
    try { await apiGet('phashUnlock'); } catch (e) {}
  }
}

function compressImage(file, maxWidth, quality) {
  maxWidth = maxWidth || 800;
  quality = quality || 0.8;
  return new Promise(function(resolve, reject) {
    var img = new Image();
    var reader = new FileReader();
    reader.onload = function(e) {
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(b) { resolve(b); }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() { resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadImageImmediate(file) {
  try {
    toast('📤 上傳中...');
    $('btnSave').disabled = true;
    var compressed = await compressImage(file);
    var base64 = await fileToBase64(compressed);
    var localPreview = 'data:image/jpeg;base64,' + base64;
    var result = await apiPost({
      action: 'uploadImage',
      productId: editingId,
      fileName: 'photo_' + Date.now() + '.jpg',
      mimeType: 'image/jpeg',
      base64: base64
    });
    if (result.error) { toast('❌ ' + result.error, 3000); return; }
    var p = allData.find(function(d) { return String(d.id) === String(editingId); });
    if (p) {
      p.image = result.imageUrl;
      p._preview = localPreview;
      p._last_source = 'user';
      p._last_modified = new Date().toISOString();
    }
    $('f_image').value = result.imageUrl;
    $('f_imagePreview').src = localPreview;
    $('f_last_modified').value = '剛剛';
    $('f_last_source').value = '🔒 使用者手動編輯';
    toast('✅ 圖片已上傳');
    clearLocalCache();
    render();
    setTimeout(async function() {
      try {
        var phash = await computePhashFromBlob(compressed);
        await apiPost({ action: 'savePhashBatch', items: [{ id: editingId, phash: phash }] });
      } catch (e) {}
    }, 500);
    setTimeout(function() { loadData(true); }, 5000);
  } catch (e) {
    toast('❌ ' + e.message, 3000);
  } finally {
    $('btnSave').disabled = false;
  }
}

async function saveProduct() {
  var data = {};
  FIELDS.forEach(function(k) { data[k] = $('f_' + k).value.trim(); });
  if (!data.id) { toast('❌ ID 不能為空'); return; }

  $('btnSave').disabled = true;
  try {
    var result = editingId
      ? await apiPost({ action: 'update', id: editingId, data: data })
      : await apiPost({ action: 'create', data: data });
    if (result.error) { toast('❌ ' + result.error, 3000); return; }

    if (!editingId && pendingImage) {
      toast('📤 上傳圖片中...');
      var compressed = await compressImage(pendingImage);
      var base64 = await fileToBase64(compressed);
      var localPreview = 'data:image/jpeg;base64,' + base64;
      var imgResult = await apiPost({
        action: 'uploadImage',
        productId: data.id,
        fileName: 'photo_' + Date.now() + '.jpg',
        mimeType: 'image/jpeg',
        base64: base64
      });
      if (imgResult.error) {
        toast('⚠️ 產品已存，圖片上傳失敗：' + imgResult.error, 4000);
      } else {
        var newP = allData.find(function(d) { return String(d.id) === String(data.id); });
        if (newP) { newP.image = imgResult.imageUrl; newP._preview = localPreview; }
        setTimeout(async function() {
          try {
            var phash = await computePhashFromBlob(compressed);
            await apiPost({ action: 'savePhashBatch', items: [{ id: data.id, phash: phash }] });
          } catch (e) {}
        }, 500);
      }
      pendingImage = null;
    }
    toast(editingId ? '✅ 已更新' : '✅ 已新增');
    closeModal();
    clearLocalCache();
    render();
    setTimeout(function() { loadData(true); }, 5000);
  } catch (e) {
    toast('❌ ' + e.message, 3000);
  } finally {
    $('btnSave').disabled = false;
  }
}

async function confirmDelete(id) {
  if (!confirm('確定刪除 ID ' + id + '？')) return;
  try {
    var result = await apiPost({ action: 'delete', id: id });
    if (result.error) { toast('❌ ' + result.error, 3000); return; }
    toast('✅ 已刪除');
    clearLocalCache();
    await loadData(true);
  } catch (e) { toast('❌ ' + e.message, 3000); }
}

async function unlockCurrentProduct() {
  if (!editingId) return;
  if (!confirm('確定解鎖？下次惠康抓取時會被自動更新覆寫。')) return;
  try {
    var result = await apiPost({ action: 'unlock', id: editingId });
    if (result.error) { toast('❌ ' + result.error); return; }
    toast('🔓 已解鎖');
    clearLocalCache();
    closeModal();
    await loadData(true);
  } catch (e) { toast('❌ ' + e.message, 3000); }
}


// ============================================================
// 條碼掃描
// ============================================================
var SCAN_FORMATS = [
  Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR,
  Html5QrcodeSupportedFormats.QR_CODE
];

async function openScanner(title, mode) {
  if (isScanning) return;
  isScanning = true;
  scanMode = mode;
  torchOn = false;
  $('scanTitle').textContent = title;
  $('scanModal').classList.add('show');
  $('torchBtn').style.display = 'none';

  setTimeout(async function() {
    try {
      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: {width:300,height:200}, aspectRatio: 1.0, formatsToSupport: SCAN_FORMATS },
        onScanSuccess,
        function() {}
      );
      try {
        var caps = html5QrCode.getRunningTrackCameraCapabilities();
        if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
          $('torchBtn').style.display = 'block';
        }
      } catch (e) {}
    } catch (e) {
      toast('❌ 無法開啟相機：' + e.message, 3000);
      closeScan();
    }
  }, 300);
}

$('btnScanSearch').onclick = function() { openScanner('🔍 掃碼搜尋', 'search'); };

function startEditScan() {
  openScanner('📷 掃描條碼', 'edit');
}

function onScanCloseClick() {
  closeScan();
}

function onScanSuccess(decodedText) {
  if (!isScanning) return;
  if (navigator.vibrate) navigator.vibrate(80);

  if (scanMode === 'search') {
    $('q').value = decodedText;
    addSearchHistory(decodedText);
    closeScan();
    searchMode = 'text';
    render();
    var term = decodedText.toLowerCase();
    var found = allData.filter(function(d) {
      var bc = String(d.barcode || '').replace(/[;,，、]/g, ' ').toLowerCase();
      return bc.split(/\s+/).indexOf(term) >= 0 ||
             String(d.id).toLowerCase() === term;
    });
    if (found.length > 0) {
      toast('✅ 找到：' + (found[0].name_zh || found[0].name), 2500);
    } else {
      toast('⚠️ 條碼 ' + decodedText + ' 未找到', 3000);
    }
  } else if (scanMode === 'edit') {
    var cur = $('f_barcode').value.trim();
    if (cur) {
      if (cur.indexOf(decodedText) < 0) {
        $('f_barcode').value = cur + ';' + decodedText;
      }
    } else {
      $('f_barcode').value = decodedText;
    }
    toast('✅ 已辨識：' + decodedText, 2000);

    var existing = allData.find(function(d) {
      var bc = String(d.barcode || '');
      return bc.split(/[;,，、]/).map(function(s) { return s.trim(); }).indexOf(decodedText) >= 0;
    });
    if (existing) {
      setTimeout(function() {
        if (confirm('此條碼已存在：\n\nID: ' + existing.id + '\n名稱: ' + (existing.name_zh || existing.name) + '\n\n要載入此產品進行編輯嗎？')) {
          closeScan();
          setTimeout(function() { openEdit(existing.id); }, 300);
        }
      }, 200);
    } else {
      closeScan();
    }
  }
}

async function closeScan() {
  isScanning = false;
  scanMode = 'none';
  $('scanModal').classList.remove('show');
  $('scanTitle').textContent = '📷 掃描條碼';
  if (html5QrCode) {
    try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
    html5QrCode = null;
  }
}

function toggleTorch() {
  if (!html5QrCode) return;
  try {
    var caps = html5QrCode.getRunningTrackCameraCapabilities();
    if (caps && caps.torchFeature && caps.torchFeature().isSupported()) {
      torchOn = !torchOn;
      caps.torchFeature().apply(torchOn);
      $('torchBtn').textContent = torchOn ? '🔦 關閉手電筒' : '🔦 開啟手電筒';
    }
  } catch (e) { toast('此裝置不支援手電筒'); }
}


// ============================================================
// 搜尋 debounce + 歷史
// ============================================================
var searchTimer;
$('q').addEventListener('input', function() {
  if (searchMode === 'image') {
    searchMode = 'text';
    loadData(true);
    return;
  }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 150);
});

$('q').addEventListener('focus', function() {
  showSearchHistory();
});

$('q').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var term = $('q').value.trim();
    if (term) addSearchHistory(term);
    hideSearchHistory();
  } else if (e.key === 'Escape') {
    hideSearchHistory();
  }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-box')) {
    hideSearchHistory();
  }
});
